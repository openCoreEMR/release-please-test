name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    if: ${{ !github.event.repository.is_template }}
    uses: opencoreemr/github-workflows-public/.github/workflows/release-please-reusable.yml@1.1.0
    permissions:
      contents: write
      pull-requests: write
    secrets:
      app-client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

  # The oce-fe-harness ADR-0053 §4.6 chaining shape, with echo legs: each
  # fires only when its own component released, and reads that
  # component's tag from release_outputs.
  web-leg:
    needs: release-please
    if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), 'apps/web') }}
    uses: ./.github/workflows/echo-release-leg.yml
    with:
      release_tag: ${{ fromJSON(needs.release-please.outputs.release_outputs)['apps/web--tag_name'] }}

  operator-leg:
    needs: release-please
    if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), 'apps/operator') }}
    uses: ./.github/workflows/echo-release-leg.yml
    with:
      release_tag: ${{ fromJSON(needs.release-please.outputs.release_outputs)['apps/operator--tag_name'] }}
