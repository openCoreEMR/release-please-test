name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    if: ${{ !github.event.repository.is_template }}
    uses: opencoreemr/github-workflows-public/.github/workflows/release-please-reusable.yml@04d2a7dd3709fe122dbd93c077e5cfd8a098a63e # 1.1.1 candidate (release-please-action v5.0.0-oce.4)
    permissions:
      contents: write
      pull-requests: write
    secrets:
      app-client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
