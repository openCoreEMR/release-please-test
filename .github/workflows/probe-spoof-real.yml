name: Probe Spoof Real

# Stands in for a required check that runs from the base branch and fails.
# Probe for oce-fe-harness#676; lives only on the probe-spoof/base branch.

on:
  pull_request_target:
    branches:
      - probe-spoof/base

permissions: {}

jobs:
  check:
    name: deploy pin-scope
    runs-on: ubuntu-24.04
    steps:
      - name: Fail, late when the head branch asks for it
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            *slow-real) sleep 90 ;;
          esac
          echo 'the real check rejects this pull request'
          exit 1
